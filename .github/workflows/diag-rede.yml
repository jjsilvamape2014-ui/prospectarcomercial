name: diag-rede

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Testar acesso as fontes
        run: |
          t() {
            printf "  %-52s " "$1"
            curl -sS -o /dev/null -w "http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" \
              --connect-timeout 12 --max-time 25 "$1" 2>&1 | tail -1
          }
          echo "=== IP do runner ==="
          curl -sS --max-time 10 https://ipinfo.io/ip; echo
          echo
          echo "=== controles ==="
          t "https://example.com/"
          t "https://www.ioepa.com.br/"
          echo
          echo "=== dominio de Belem ==="
          t "https://sistemas.belem.pa.gov.br/"
          t "http://sistemas.belem.pa.gov.br/"
          t "https://www.belem.pa.gov.br/"
          t "https://belem.pa.gov.br/"
          echo
          echo "=== DNS ==="
          for h in sistemas.belem.pa.gov.br www.belem.pa.gov.br belem.pa.gov.br; do
            printf "  %-32s " "$h"; getent hosts "$h" || echo "(nao resolve)"
          done
          echo
          echo "=== traceroute (máx 12 saltos) ==="
          timeout 40 traceroute -n -w 2 -m 12 -q 1 187.73.105.151 2>/dev/null | tail -14 || echo "  indisponivel"
